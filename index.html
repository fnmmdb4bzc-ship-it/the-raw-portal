<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Raw Portal</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#121111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RAW">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>try{var t=localStorage.getItem('raw-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="app.css">
</head>
<body>

<div id="gate">
  <div class="gatebox">
    <div class="mark" aria-hidden="true"></div>
    <h1>THE RAW<br><span>PORTAL</span></h1>
    <p id="gateText">Team members only. Sign in to continue.</p>
    <button class="btn" id="gGoogle">Sign in with Google</button>
    <div id="gEmailBox">
      <input type="email" id="gEmail" placeholder="or type your email address" autocomplete="email" aria-label="Email address">
      <button class="btn ghost" id="gLink">Email me a sign-in link</button>
    </div>
    <button class="btn ghost" id="gOut" hidden>Sign out</button>
    <div class="err" id="gateErr" role="alert"></div>
  </div>
</div>

<div id="app" class="shell" hidden>
  <aside class="side" id="side"></aside>
  <div class="col-main">
    <header class="top">
      <button class="logo" data-act="go" data-id="home" aria-label="Dashboard"><span class="mark" aria-hidden="true"></span><b>RAW</b><span id="portalName">Portal</span></button>
      <select class="brandsel" id="brandFilter" aria-label="Show brand"></select>
      <button class="icon-btn" data-act="search" aria-label="Search"><svg class="i"><use href="#i-search"/></svg></button>
      <button class="icon-btn" data-act="inbox" aria-label="Notifications"><svg class="i"><use href="#i-bell"/></svg><span class="dot" id="inboxDot" hidden></span></button>
      <button class="icon-btn" data-act="theme" aria-label="Switch between light and dark"><svg class="i"><use id="themeIcon" href="#i-moon"/></svg></button>
      <button class="capbtn" data-act="capture"><svg class="i"><use href="#i-plus"/></svg>Quick capture</button>
    </header>
    <main id="view"></main>
  </div>
  <nav class="bottom" id="bottom" aria-label="Main"></nav>
</div>

<!-- Dialogs sit outside the parts of the page that redraw, so typing and chosen files are never lost. -->
<dialog id="dlg">
  <form class="dl" id="dlgForm" method="dialog" novalidate>
    <div class="dlhd"><h2 id="fTitle"></h2></div>
    <div id="fBody"></div>
    <div class="err" id="fErr" role="alert"></div>
    <div class="dlbtns">
      <button type="submit" class="btn" id="fSave">Save</button>
      <button type="button" class="btn ghost" id="fCancel">Cancel</button>
      <span class="sp"></span>
      <button type="button" class="link" id="fDel" hidden>Delete</button>
    </div>
  </form>
</dialog>

<dialog id="sheet" class="full"><div class="dl" id="sheetBody"></div></dialog>
<dialog id="capture" class="full"><div class="dl" id="capBody"></div></dialog>
<dialog id="pop"><div class="dl" id="popBody"></div></dialog>
<dialog id="viewer"><div class="dl"><img id="vImg" alt="" class="vimg"><p id="vCap" class="pre"></p><div class="dlbtns"><button type="button" class="btn ghost" id="vClose">Close</button><span class="sp"></span><button type="button" class="link" id="vEdit">Edit</button></div></div></dialog>
<div id="toast" hidden role="status"></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5 10 17.5 19 7"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>

  <symbol id="i-money" viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="12" rx="2.5"/><circle cx="12" cy="12" r="2.8"/><path d="M6 9.5v5M18 9.5v5"/></symbol>

<script src="js/core.js"></script>
<script src="js/engine.js"></script>
<script src="js/forms.js"></script>
<script src="js/views.js"></script>
<script src="js/more.js"></script>
<script src="js/main.js"></script>
</body>
</html>
