<!doctype html>
<html lang="en-ZA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Raw Portal</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RAW">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#0a0a0a; --card:#151515; --card2:#1d1d1d; --line:#2c2c2c; --ink:#f4f4f4; --mut:#9b9b9b;
  --red:#e10600; --redink:#ff3b30; --onred:#fff; --ok:#f4f4f4;
  --head:'Anton',Impact,'Arial Narrow Bold','Haettenschweiler',sans-serif;
  --body:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){ :root:not([data-theme=dark]){
  --bg:#f2f2f0; --card:#fff; --card2:#f0f0ee; --line:#d6d6d3; --ink:#0a0a0a; --mut:#5c5c5c; --redink:#c40500; --ok:#0a0a0a; color-scheme:light; } }
:root[data-theme=light]{
  --bg:#f2f2f0; --card:#fff; --card2:#f0f0ee; --line:#d6d6d3; --ink:#0a0a0a; --mut:#5c5c5c; --redink:#c40500; --ok:#0a0a0a; color-scheme:light; }
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);min-height:100vh;min-height:100dvh;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
h1,h2,h3,.hd{font-family:var(--head);font-weight:400;text-transform:uppercase;letter-spacing:.04em;margin:0;line-height:1.05}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--redink)}

/* header */
header.top{position:sticky;top:0;z-index:20;background:#0a0a0a;color:#fff;border-bottom:3px solid var(--red);padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;display:flex;align-items:center;gap:10px}
.logo{font-family:var(--head);font-size:30px;letter-spacing:.06em;line-height:1;display:flex;align-items:baseline;gap:6px;min-width:0}
.logo b{font-weight:400}
.logo i{font-style:normal;color:var(--red);transform:skewX(-14deg);display:inline-block}
.logo span{text-transform:uppercase;font-size:13px;letter-spacing:.22em;color:#bdbdbd;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sp{flex:1}
.ghost{background:none;border:1px solid #444;color:#fff;padding:8px 12px;font-family:var(--head);letter-spacing:.1em;text-transform:uppercase;font-size:13px;min-height:40px}

/* tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#0a0a0a;border-top:1px solid #2c2c2c;display:flex;overflow-x:auto;scrollbar-width:none;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:0 0 auto;background:none;border:0;border-top:3px solid transparent;margin-top:-1px;color:#9b9b9b;font-family:var(--head);text-transform:uppercase;letter-spacing:.1em;font-size:14px;padding:14px 14px 13px;min-height:50px}
nav.tabs button[aria-current=page]{color:#fff;border-top-color:var(--red)}

main{max-width:760px;margin:0 auto;padding:16px 14px calc(env(safe-area-inset-bottom) + 90px)}
.titlebar{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:4px 0 14px}
.titlebar h1{font-size:clamp(28px,9vw,40px);overflow-wrap:anywhere}
.titlebar>div{min-width:0}
.btn,.edit,.chip{white-space:nowrap;flex:0 0 auto}
.titlebar h1::after{content:'';display:block;width:54px;height:5px;background:var(--red);margin-top:6px;transform:skewX(-20deg)}
.sub{color:var(--mut);font-size:14px}
section{margin:0 0 22px}
.sechd{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 8px}
.sechd h2{font-size:20px;letter-spacing:.08em}
.sechd h2::before{content:'/ ';color:var(--red)}

.btn{background:var(--red);border:0;color:var(--onred);font-family:var(--head);text-transform:uppercase;letter-spacing:.1em;font-size:15px;padding:11px 16px;min-height:44px}
.btn:disabled{opacity:.5}
.btn.line{background:none;border:1px solid var(--line);color:var(--ink)}
.btn.sm{font-size:13px;padding:8px 11px;min-height:38px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.chip{background:none;border:1px solid var(--line);color:var(--mut);padding:7px 11px;font-size:13px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;min-height:36px}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.card{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--line);padding:12px 12px 12px 14px;margin:0 0 8px}
.card.hot{border-left-color:var(--red)}
.card h3{font-family:var(--body);font-weight:800;text-transform:none;letter-spacing:0;font-size:17px;line-height:1.25;overflow-wrap:anywhere}
.card p{margin:4px 0 0;overflow-wrap:anywhere}
.pre{white-space:pre-wrap}
.meta{color:var(--mut);font-size:13px;margin-top:4px}
.row{display:flex;gap:10px;align-items:flex-start}
.row .grow{flex:1;min-width:0}
.tag{display:inline-block;border:1px solid var(--line);color:var(--mut);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;padding:2px 6px;margin-right:4px;white-space:nowrap}
.tag.red{background:var(--red);border-color:var(--red);color:#fff}
.tag.inv{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.empty{color:var(--mut);border:1px dashed var(--line);padding:16px;text-align:center;font-size:15px}
.tick{flex:0 0 auto;width:30px;height:30px;border:2px solid var(--mut);background:none;padding:0;display:grid;place-items:center;font-weight:900;font-size:18px;line-height:1;color:var(--bg)}
.tick[aria-checked=true]{background:var(--red);border-color:var(--red);color:#fff}
.done h3{text-decoration:line-through;color:var(--mut);font-weight:600}
.edit{background:none;border:0;color:var(--mut);font-size:13px;text-transform:uppercase;letter-spacing:.08em;font-weight:800;padding:6px 4px;min-height:36px}
.big{font-family:var(--head);font-size:46px;line-height:1}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.stat{background:var(--card);border:1px solid var(--line);padding:12px}
.stat .n{font-family:var(--head);font-size:26px;line-height:1.1;overflow-wrap:anywhere}
.stat .l{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.1em;font-weight:700}
.bar{height:8px;background:var(--card2);border:1px solid var(--line);margin-top:6px}
.bar i{display:block;height:100%;background:var(--ink)}
.bar.over i{background:var(--red)}
.split{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.amt{font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums}

/* calendar */
.calhd{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.calhd h2{font-size:24px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:14px}
.cal .dow{color:var(--mut);font-size:11px;text-align:center;text-transform:uppercase;letter-spacing:.08em;font-weight:800;padding:4px 0}
.cal button{background:var(--card);border:1px solid var(--line);min-height:52px;padding:4px 2px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink);font-weight:700}
.cal button.out{opacity:.35}
.cal button.today{border-color:var(--red);color:var(--redink)}
.cal button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center}
.dots i{width:7px;height:7px;display:block}
.d-ev{background:var(--red)} .d-re{background:currentColor} .d-tr{background:var(--mut)} .d-cd{border:2px solid var(--red)}
.legend{display:flex;gap:12px;flex-wrap:wrap;color:var(--mut);font-size:12px;margin-bottom:14px}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;display:block}

/* photos */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(min-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}
.ph{background:var(--card);border:1px solid var(--line);padding:0;text-align:left;color:var(--ink);display:block;width:100%}
.ph img{display:block;width:100%;aspect-ratio:1;object-fit:cover;background:var(--card2)}
.ph div{padding:8px 9px 9px;font-size:14px;overflow-wrap:anywhere}
.ph small{display:block;color:var(--mut);font-size:12px}
.strip{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.strip img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--card2);border:1px solid var(--line)}
.strip button{padding:0;border:0;background:none}

.inline{display:flex;gap:6px;margin-bottom:12px}
.inline input,.inline select{min-width:0}
input[type=file]{width:100%;font-size:15px;padding:8px 0}
input[type=text],input[type=email],input[type=tel],input[type=date],input[type=time],input[type=month],input[type=number],select,textarea{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--ink);padding:11px 10px;font-size:16px;border-radius:0;min-height:46px;-webkit-appearance:none;appearance:none}
textarea{min-height:120px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--red);outline-offset:1px}
label.f{display:block;margin:0 0 12px}
label.f>span,fieldset.f>legend{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.1em;font-weight:800;color:var(--mut);margin-bottom:5px;padding:0}
fieldset.f{border:0;padding:0;margin:0 0 12px}
.cb{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:16px}
.cb input{width:22px;height:22px;accent-color:var(--red);flex:0 0 auto}
.hint{color:var(--mut);font-size:13px;margin:-6px 0 12px}

dialog{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-top:4px solid var(--red);padding:0;width:min(560px,calc(100vw - 20px));max-height:calc(100dvh - 30px)}
dialog::backdrop{background:rgba(0,0,0,.75)}
.dl{padding:16px;overflow:auto;max-height:calc(100dvh - 34px)}
.dl h2{font-size:26px;margin-bottom:14px}
.dlbtns{display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap}
.dlbtns .sp{flex:1}
.err{color:var(--redink);font-size:14px;min-height:1em;margin:6px 0}
#viewer img{display:block;width:100%;max-height:62dvh;object-fit:contain;background:#000}

/* gate */
#gate{min-height:100dvh;display:grid;place-items:center;padding:24px;background:#0a0a0a;color:#fff}
.gatebox{width:min(400px,100%);text-align:center}
.gatebox .mark{font-family:var(--head);font-size:112px;line-height:.9;letter-spacing:.04em}
.gatebox .slash{height:8px;background:var(--red);transform:skewX(-20deg);margin:12px auto 14px;width:70%}
.gatebox .nm{font-family:var(--head);letter-spacing:.3em;font-size:16px;color:#bdbdbd;text-transform:uppercase}
.gatebox p{color:#bdbdbd}
.gatebox .btn{width:100%;margin-top:10px}
.gatebox .btn.line{border-color:#444;color:#fff}
.gatebox input{background:#1d1d1d;border-color:#444;color:#fff;margin-top:18px}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 70px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 14px;font-weight:700;font-size:14px;z-index:99;max-width:90vw;text-align:center}
.comment{border-top:1px solid var(--line);padding:8px 0 0;margin-top:8px;font-size:15px}
.vote{flex:0 0 auto;background:none;border:2px solid var(--line);color:var(--ink);min-width:48px;padding:6px 4px;font-family:var(--head);font-size:20px;line-height:1.1;display:flex;flex-direction:column;align-items:center}
.vote small{font-family:var(--body);font-size:10px;font-weight:800;letter-spacing:.08em;color:var(--mut)}
.vote[aria-pressed=true]{background:var(--red);border-color:var(--red);color:#fff}
.vote[aria-pressed=true] small{color:#fff}
.kv{display:flex;justify-content:space-between;gap:10px;align-items:center}
.copy{background:none;border:0;text-align:left;padding:0;font-weight:700;font-size:16px;overflow-wrap:anywhere;color:var(--ink)}
</style>
</head>
<body>

<div id="gate">
  <div class="gatebox">
    <div class="mark">RAW</div>
    <div class="slash"></div>
    <div class="nm" id="gateName">The Raw Portal</div>
    <p id="gateText">Members only. Sign in to continue.</p>
    <button class="btn" id="gGoogle">Sign in with Google</button>
    <div id="gEmailBox">
      <input type="email" id="gEmail" placeholder="or type your email address" autocomplete="email" aria-label="Email address">
      <button class="btn line" id="gLink">Email me a sign-in link</button>
    </div>
    <button class="btn line" id="gOut" hidden>Sign out</button>
    <div class="err" id="gateErr" role="alert"></div>
  </div>
</div>

<div id="app" hidden>
  <header class="top">
    <div class="logo"><b>RAW</b><i>/</i><span id="portalName">PORTAL</span></div>
    <div class="sp"></div>
    <button class="ghost" data-act="settings">Team</button>
  </header>
  <main id="view"></main>
  <nav class="tabs" id="tabs" aria-label="Sections"></nav>
</div>

<!-- These dialogs sit outside the part of the page that redraws, so typed text and chosen photos are never lost. -->
<dialog id="dlg">
  <form class="dl" id="dlgForm" method="dialog" novalidate>
    <h2 id="fTitle"></h2>
    <div id="fBody"></div>
    <div class="err" id="fErr" role="alert"></div>
    <div class="dlbtns">
      <button type="submit" class="btn" id="fSave">Save</button>
      <button type="button" class="btn line" id="fCancel">Cancel</button>
      <span class="sp"></span>
      <button type="button" class="edit" id="fDel" hidden>Delete</button>
    </div>
  </form>
</dialog>

<dialog id="viewer">
  <div class="dl">
    <img id="vImg" alt="">
    <p id="vCap" class="pre"></p>
    <div class="meta" id="vMeta"></div>
    <div class="dlbtns">
      <button type="button" class="btn line" id="vClose">Close</button>
      <span class="sp"></span>
      <button type="button" class="edit" id="vEdit">Edit</button>
    </div>
  </div>
</dialog>

<dialog id="settings"><div class="dl" id="setBody"></div></dialog>

<div id="toast" hidden role="status"></div>

<script>
(() => {
'use strict';
const SUPABASE_URL = 'https://qbpqaaqjgwgsszclenvl.supabase.co';
// Public key: it is meant to be visible in a web page. The database security rules are what protect the data.
const SUPABASE_KEY = 'sb_publishable_m8tnkhKUkHTp3r0sahR4Pw_5P2Kjmne';

const TABS = [['today','Today'],['calendar','Calendar'],['reminders','Reminders'],['collab','Collab'],['ideas','Ideas'],['money','Money'],['photos','Photos'],['docs','Docs'],['trips','Trips'],['details','Details'],['lists','Lists'],['countdowns','Countdowns']];
const DEFAULTS = {
  name: 'The Raw Portal',
  notice: '',
  categories: ['Stock','Packaging','Shipping and courier','Marketing','Equipment','Software and subscriptions','Travel','Professional fees','Rent and utilities','Other'],
  lists: ['Stock and supplies','Packaging','Office','Events','Other'],
  folders: ['Contracts','Invoices and quotes','Certificates and compliance','Marketing','Product','Other'],
  budgets: {}
};
const IDEA_STATUS = ['New','Discussing','Doing','Done','Parked'];

const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
const ym = d => d.getFullYear() + '-' + pad(d.getMonth()+1);
const parse = s => { const [y,m,d] = String(s).split('-').map(Number); return new Date(y, (m||1)-1, d||1); };
const TODAY = () => ymd(new Date());
const fmt = s => s ? parse(s).toLocaleDateString('en-ZA',{weekday:'short',day:'numeric',month:'short',year:'numeric'}) : '';
const fmtS = s => s ? parse(s).toLocaleDateString('en-ZA',{day:'numeric',month:'short'}) : '';
const ymLabel = s => parse(s + '-01').toLocaleDateString('en-ZA',{month:'long',year:'numeric'});
const daysTo = s => Math.round((parse(s) - parse(TODAY())) / 864e5);
const ZAR = new Intl.NumberFormat('en-ZA',{style:'currency',currency:'ZAR'});
const money = n => ZAR.format(Number(n)||0);
const newId = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
function parseAmount(v){
  let s = String(v == null ? '' : v).replace(/[Rr\s ]/g,'');
  if(!s) return NaN;
  const c = s.lastIndexOf(','), d = s.lastIndexOf('.');
  if(c > -1 && d > -1) s = c > d ? s.replace(/\./g,'').replace(',','.') : s.replace(/,/g,'');
  else if(c > -1) s = s.replace(',','.');
  return /^-?\d*\.?\d+$/.test(s) ? Math.round(parseFloat(s)*100)/100 : NaN;
}
function dueText(s){ const n = daysTo(s); return n < -1 ? (-n) + ' days late' : n === -1 ? '1 day late' : n === 0 ? 'Today' : n === 1 ? 'Tomorrow' : 'In ' + n + ' days'; }
function dueTag(s){ const n = daysTo(s); return '<span class="tag ' + (n < 0 ? 'red' : n <= 1 ? 'inv' : '') + '">' + dueText(s) + '</span>'; }

let sb = null, me = null, M = [], D = {}, chan = null, curUid = null, loaded = false;
const ui = { tab:'today', calMonth: ym(new Date()), calDay: TODAY(), remFilter:'open', moneyMonth: ym(new Date()), listFilter:'all', ideaSort:'top', openIdea:null, photoLimit:30, docFilter:'all', showDone:false, focus:null };

const list = col => Object.entries(D[col] || {}).map(([id,d]) => Object.assign({id}, d));
const get = (col,id) => (D[col] || {})[id];
const cfg = () => Object.assign({}, DEFAULTS, get('settings','main') || {});
const nameOf = e => { if(!e || e === 'all') return 'Everyone'; if(e === 'company') return 'Company account'; const m = M.find(x => x.email === e); return m ? (m.name || m.email.split('@')[0]) : e.split('@')[0]; };
const names = arr => (arr && arr.length ? arr.map(nameOf).join(', ') : 'Everyone');
const by = (k, dir=1) => (a,b) => (a[k] > b[k] ? 1 : a[k] < b[k] ? -1 : 0) * dir;

let toastT;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 3600); }

/* ---------- saving: the screen updates first, the save happens in the background ---------- */
function put(col, id, data){
  (D[col] = D[col] || {})[id] = data; render();
  sb.from('docs').upsert({collection:col, id, data, updated_at:new Date().toISOString()}).then(({error}) => { if(error) toast('Could not save. ' + error.message); });
}
function patch(col, id, changes){ put(col, id, Object.assign({}, get(col,id) || {}, changes)); }
function del(col, id){
  if(D[col]) delete D[col][id]; render();
  sb.from('docs').delete().eq('collection',col).eq('id',id).then(({error}) => { if(error) toast('Could not delete. ' + error.message); });
}
function saveCfg(changes){ put('settings','main', Object.assign({}, get('settings','main') || {}, changes)); }
function stamp(){ return { by: me.email, at: new Date().toISOString() }; }

async function loadAll(){
  const out = {}; let from = 0;
  for(;;){
    const {data, error} = await sb.from('docs').select('collection,id,data').range(from, from + 999);
    if(error) throw error;
    data.forEach(r => { (out[r.collection] = out[r.collection] || {})[r.id] = r.data; });
    if(data.length < 1000) break; from += 1000;
  }
  D = out; loaded = true;
}
async function loadMembers(){
  const {data, error} = await sb.from('allowed_emails').select('email,name,is_admin').order('name');
  if(error) throw error;
  M = data || []; return M;
}
function subscribe(){
  if(chan) sb.removeChannel(chan);
  chan = sb.channel('raw-portal')
    .on('postgres_changes',{event:'*',schema:'public',table:'docs'}, p => {
      if(p.eventType === 'DELETE'){ const o = p.old || {}; if(D[o.collection]) delete D[o.collection][o.id]; }
      else { const n = p.new; (D[n.collection] = D[n.collection] || {})[n.id] = n.data; }
      schedule();
    })
    .on('postgres_changes',{event:'*',schema:'public',table:'allowed_emails'}, () => { loadMembers().then(() => { me = M.find(x => x.email === me.email) || me; schedule(); if($('#settings').open) renderSettings(); }).catch(() => {}); })
    .subscribe();
}
document.addEventListener('visibilitychange', () => { if(!document.hidden && me && loaded) loadAll().then(schedule).catch(() => {}); });

/* ---------- drawing ---------- */
let pending = false;
function schedule(){
  const a = document.activeElement;
  if(a && $('#view').contains(a) && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)){ pending = true; return; }   // never redraw under someone typing
  render();
}
$('#view').addEventListener('focusout', () => { if(pending){ pending = false; setTimeout(schedule, 80); } });

/* photos live in private storage; the page asks for short-lived links to show them */
const urlCache = new Map();
async function hydrate(){
  const imgs = $$('img[data-p]'), need = [...new Set(imgs.map(i => i.dataset.p).filter(p => p && !urlCache.has(p)))];
  if(need.length){
    const {data} = await sb.storage.from('photos').createSignedUrls(need, 3600);
    (data || []).forEach(r => { if(r.signedUrl) urlCache.set(r.path, r.signedUrl); });
    setTimeout(() => need.forEach(p => urlCache.delete(p)), 55*60*1000);
  }
  $$('img[data-p]').forEach(i => { const u = urlCache.get(i.dataset.p); if(u && i.src !== u) i.src = u; });
  const links = $$('a[data-f]'), needF = [...new Set(links.map(a => a.dataset.f).filter(p => p && !fileUrls.has(p)))];
  if(needF.length){
    const {data} = await sb.storage.from('files').createSignedUrls(needF, 3600);
    (data || []).forEach(r => { if(r.signedUrl) fileUrls.set(r.path, r.signedUrl); });
    setTimeout(() => needF.forEach(p => fileUrls.delete(p)), 55*60*1000);
  }
  $$('a[data-f]').forEach(a => { const u = fileUrls.get(a.dataset.f); if(u) a.href = u; });
}
const fileUrls = new Map();
const MAX_FILE = 25 * 1024 * 1024;
const sizeText = n => !n ? '' : n < 1024*1024 ? Math.max(1, Math.round(n/1024)) + ' KB' : (n/1024/1024).toFixed(1).replace('.',',') + ' MB';
async function uploadFile(file){
  if(file.size > MAX_FILE) throw new Error('That file is ' + sizeText(file.size) + '. The limit is 25 MB per file.');
  const safe = (file.name || 'file').normalize('NFKD').replace(/[^\w.\- ]+/g,'').trim().replace(/\s+/g,'-').slice(-80) || 'file';
  const path = newId() + '/' + safe;
  const r = await sb.storage.from('files').upload(path, file, {contentType: file.type || 'application/octet-stream'}); if(r.error) throw r.error;
  return {path, name: file.name || safe, size: file.size, type: file.type || ''};
}
async function loadImg(file){
  const url = URL.createObjectURL(file);
  try { return await new Promise((res,rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('That file could not be read as a photo.')); i.src = url; }); }
  finally { setTimeout(() => URL.revokeObjectURL(url), 1500); }
}
function toBlob(img, max, q){
  let w = img.naturalWidth, h = img.naturalHeight; const s = Math.min(1, max/Math.max(w,h)); w = Math.round(w*s); h = Math.round(h*s);
  const c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').drawImage(img,0,0,w,h);
  return new Promise(r => c.toBlob(r,'image/jpeg',q));
}
async function uploadPhoto(file){

    toast('Building the Excel file'); await loadXlsx();
    const c = cfg(), mon = ui.moneyMonth, all = list('expenses').sort(by('month')), es = all.filter(e => e.month === mon);
    const row = e => ({'Budget month':e.month, 'What':e.title, 'Category':e.cat, 'Amount (R)':e.amount, 'Paid from':nameOf(e.from), 'Paid back':e.from === 'company' ? '' : (e.repaid ? 'Yes, ' + e.repaid : 'No, still owed'), 'Notes':e.notes || ''});
    const byCat = {}; es.forEach(e => byCat[e.cat] = (byCat[e.cat] || 0) + e.amount);
    const cats = [...new Set([...c.categories, ...Object.keys(byCat)])];
    const sum = cats.map(k => ({'Category':k, 'Budget (R)':Number(c.budgets[k]) || 0, 'Spent (R)':Math.round((byCat[k] || 0)*100)/100, 'Left (R)':Math.round(((Number(c.budgets[k]) || 0) - (byCat[k] || 0))*100)/100}));
    sum.push({'Category':'TOTAL', 'Budget (R)':sum.reduce((a,r) => a + r['Budget (R)'],0), 'Spent (R)':Math.round(sum.reduce((a,r) => a + r['Spent (R)'],0)*100)/100, 'Left (R)':Math.round(sum.reduce((a,r) => a + r['Left (R)'],0)*100)/100});
    const owed = owedMap(), wb = XLSX.utils.book_new(), add = (rows, name, empty) => XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows.length ? rows : [empty]), name);
    add(sum, 'Summary ' + mon, {});
    add(es.map(row), 'Entries ' + mon, {'What':'No entries'});
    add(Object.keys(owed).map(k => ({'Partner':nameOf(k), 'Still owed (R)':Math.round(owed[k]*100)/100})), 'Owed to partners', {'Partner':'Nobody is owed anything'});
    add(all.map(row), 'All entries', {'What':'No entries'});
    XLSX.writeFile(wb, 'RAW-spending-' + mon + '.xlsx');
  }catch(e){ toast(e.message || 'Export failed.'); }
}

/* ---------- team and settings ---------- */
function renderSettings(){
  const c = cfg(), th = (() => { try { return localStorage.getItem('raw-theme') || 'auto'; } catch(e){ return 'auto'; } })();
  $('#setBody').innerHTML = '<h2>Team and settings</h2>' +
    '<div class="sechd"><h2>Who has access</h2>' + (me.is_admin ? '<button class="btn sm" data-act="addMember">+ Add</button>' : '') + '</div>' +
    M.map(m => '<div class="card"><div class="row"><div class="grow"><h3>' + esc(m.name || m.email) + (m.is_admin ? ' <span class="tag red">Admin</span>' : '') + '</h3><div class="meta">' + esc(m.email) + '</div></div>' + (me.is_admin ? '<button class="edit" data-act="editMember" data-id="' + esc(m.email) + '">Edit</button>' : '') + '</div></div>').join('') +
    '<p class="hint" style="margin-top:8px">' + (me.is_admin ? 'Only the people listed here can open the portal. They sign in with exactly this email address.' : 'Only an admin can add or remove people.') + '</p>' +
    '<div class="sechd" style="margin-top:18px"><h2>Portal</h2></div>' +
    '<p><button class="btn line" data-act="editPortal">Name, categories and lists</button></p>' +
    '<div class="sechd" style="margin-top:18px"><h2>Look</h2></div>' + chips('theme', th, [['auto','Follow phone'],['dark','Dark'],['light','Light']]) +
    '<div class="dlbtns" style="margin-top:18px"><button class="btn line" data-act="closeSettings">Close</button><span class="sp"></span><button class="edit" data-act="signOut">Sign out (' + esc(me.email) + ')</button></div>';
}
function memberForm(email){
  const cur = email ? M.find(m => m.email === email) : null;
  openForm({ title: cur ? 'Edit team member' : 'Add team member', values: cur || {},
    fields: [{k:'name',label:'Name',required:true}].concat(cur ? [] : [{k:'email',label:'Email they sign in with',type:'email',required:true}]).concat([{k:'is_admin',label:'Admin (can add and remove people)',type:'check'}]),
    onSave: async v => {
      if(cur){ if(cur.email === me.email && !v.is_admin) throw new Error('You cannot remove your own admin rights. Ask another admin.');
        const {error} = await sb.from('allowed_emails').update({name:v.name, is_admin:v.is_admin}).eq('email',cur.email); if(error) throw error; }
      else { const e = v.email.toLowerCase(); if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e)) throw new Error('That does not look like an email address.');
        const {error} = await sb.from('allowed_emails').insert({email:e, name:v.name, is_admin:v.is_admin}); if(error) throw new Error(error.code === '23505' ? 'That email is already on the list.' : error.message); }
      await loadMembers(); me = M.find(x => x.email === me.email) || me; renderSettings(); render();
    },
    deleteLabel: 'Remove access',
    onDelete: cur && cur.email !== me.email ? async () => { const {error} = await sb.from('allowed_emails').delete().eq('email',cur.email); if(error) toast(error.message); await loadMembers(); renderSettings(); render(); } : null });
}
function applyTheme(t){ if(t === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', t); }
try { applyTheme(localStorage.getItem('raw-theme') || 'auto'); } catch(e){}

/* ---------- every tap ---------- */
const A = {
  tab: id => showTab(id),
  settings: () => { renderSettings(); $('#settings').showModal(); },
  closeSettings: () => $('#settings').close(),
  signOut: () => { $('#settings').close(); sb.auth.signOut(); },
  addMember: () => memberForm(), editMember: id => memberForm(id),
  theme: id => { try { localStorage.setItem('raw-theme', id); } catch(e){} applyTheme(id); renderSettings(); },
  editPortal: () => { const c = cfg(); openForm({ title:'Portal settings', values:{name:c.name, cats:c.categories.join('\n'), lists:c.lists.join('\n'), folders:c.folders.join('\n')},
    fields:[{k:'name',label:'Portal name',required:true},{k:'cats',label:'Expense categories, one per line',type:'textarea',rows:8,required:true},{k:'lists',label:'Shopping lists, one per line',type:'textarea',rows:5,required:true},{k:'folders',label:'Document folders, one per line',type:'textarea',rows:5,required:true}],
    onSave: v => { const lines = s => [...new Set(s.split('\n').map(x => x.trim()).filter(Boolean))]; saveCfg({name:v.name, categories:lines(v.cats), lists:lines(v.lists), folders:lines(v.folders)}); } }); },
  editNotice: () => openForm({ title:'Notice board', values:{notice:cfg().notice}, fields:[{k:'notice',label:'Message for everyone',type:'textarea',rows:5}], onSave: v => saveCfg({notice:v.notice}) }),

  addEvent: () => formEvent(), editEvent: id => formEvent(id),
  calDay: id => { ui.calDay = id; if(id.slice(0,7) !== ui.calMonth) ui.calMonth = id.slice(0,7); render(); },
  calPrev: () => { ui.calMonth = shiftMonth(ui.calMonth,-1); render(); }, calNext: () => { ui.calMonth = shiftMonth(ui.calMonth,1); render(); },

  addReminder: () => formReminder(), editReminder: id => formReminder(id),
  remFilter: id => { ui.remFilter = id; render(); }, toggleDone: () => { ui.showDone = !ui.showDone; render(); },
  tickReminder: id => { const r = get('reminders',id); if(!r) return;
    if(r.done) patch('reminders',id,{done:false, doneAt:''});
    else if(r.repeat && r.repeat !== 'none' && r.due){ patch('reminders',id,{due:bump(r.due,r.repeat)}); toast('Done. Next one is ' + fmt(bump(r.due,r.repeat))); }
    else patch('reminders',id,{done:true, doneAt:new Date().toISOString(), doneBy:me.email}); },

  addNote: () => formNote(), editNote: id => formNote(id),
  addIdea: () => formIdea(), editIdea: id => formIdea(id),
  ideaSort: id => { ui.ideaSort = id; render(); },
  openIdea: id => { ui.openIdea = ui.openIdea === id ? null : id; render(); },
  vote: id => { const i = get('ideas',id); if(!i) return; const v = i.votes || []; patch('ideas',id,{votes: v.includes(me.email) ? v.filter(x => x !== me.email) : [...v, me.email]}); },

  addExpense: () => formExpense(), editExpense: id => formExpense(id),
  monPrev: () => { ui.moneyMonth = shiftMonth(ui.moneyMonth,-1); render(); }, monNext: () => { ui.moneyMonth = shiftMonth(ui.moneyMonth,1); render(); },
  budgets: () => { const c = cfg(); openForm({ title:'Monthly budgets', values:Object.fromEntries(c.categories.map((k,i) => ['b'+i, c.budgets[k] || ''])),
    fields:[{type:'note',label:'How much the company plans to spend per category each month. Leave blank for no budget.'}].concat(c.categories.map((k,i) => ({k:'b'+i, label:k, type:'amount', ph:'0'}))),
    onSave: v => { const b = {}; c.categories.forEach((k,i) => { if(v['b'+i]) b[k] = v['b'+i]; }); saveCfg({budgets:b}); } }); },
  repay: id => { const o = owedMap()[id] || 0; openForm({ title:'Pay back ' + nameOf(id), saveLabel:'Mark as paid back', values:{date:TODAY()},
    fields:[{type:'note',label:'This marks everything ' + esc(nameOf(id)) + ' paid from their own pocket as paid back: <b>' + money(o) + '</b>. It does not move any money, it only updates the record.'},{k:'date',label:'Date paid back',type:'date',required:true}],
    onSave: v => { const rows = list('expenses').filter(e => e.from === id && !e.repaid); rows.forEach(e => { const {id:eid, ...d} = e; D.expenses[eid] = Object.assign(d,{repaid:v.date}); }); render();
      return sb.from('docs').upsert(rows.map(e => ({collection:'expenses', id:e.id, data:D.expenses[e.id], updated_at:new Date().toISOString()}))).then(({error}) => { if(error) throw error; }); } }); },
  viewReceipt: id => { const e = get('expenses',id); if(e && e.photo) openViewer(e.photo, e.title + ', ' + money(e.amount), ''); },
  exportXlsx,

  addPhoto: () => formPhoto(), morePhotos: () => { ui.photoLimit += 30; render(); },
  viewPhoto: id => { const p = get('photos',id); if(p) openViewer(p, p.caption, nameOf(p.by) + ' · ' + fmt(p.date), () => formPhoto(id)); },

  addTrip: () => formTrip(), editTrip: id => formTrip(id),
  tickTrip: (id, el) => { const t = get('trips',id); if(!t) return; const cl = (t.checklist || []).map((x,i) => i === +el.dataset.i ? {t:x.t, done:!x.done} : x); patch('trips',id,{checklist:cl}); },

  addCompany: () => formCompany(), editCompany: id => formCompany(id),
  addPerson: () => formPerson(), editPerson: id => formPerson(id),
  addContact: () => formContact(), editContact: id => formContact(id),
  copy: id => { const x = get('company',id); if(!x) return; (navigator.clipboard ? navigator.clipboard.writeText(x.value) : Promise.reject()).then(() => toast('Copied'), () => toast('Could not copy. Press and hold the text instead.')); },

  editItem: id => formItem(id), listFilter: id => { ui.listFilter = id; render(); },
  tickItem: id => { const i = get('shopping',id); if(i) patch('shopping',id,{done:!i.done}); },
  clearTicked: () => { const ids = list('shopping').filter(i => i.done).map(i => i.id); ids.forEach(id => delete D.shopping[id]); render(); sb.from('docs').delete().eq('collection','shopping').in('id',ids).then(({error}) => { if(error) toast('Could not clear. ' + error.message); }); },

  addFile: () => formFile(), editFile: id => formFile(id), docFilter: id => { ui.docFilter = id; render(); },
  addCountdown: () => formCountdown(), editCountdown: id => formCountdown(id)
};
document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if(!el || !me) return; const fn = A[el.dataset.act]; if(fn){ if(el.tagName === 'A') e.preventDefault(); fn(el.dataset.id, el); } });
$('#view').addEventListener('submit', e => {
  e.preventDefault(); const f = e.target;
  if(f.dataset.form === 'addItem'){ const inp = $('#addItem'), t = inp.value.trim(); if(!t) return; const l = $('#addList').value; ui.lastList = l; inp.value = ''; ui.focus = 'addItem'; put('shopping', newId(), Object.assign({title:t, list:l, done:false}, stamp())); }
  if(f.dataset.form === 'comment'){ const id = f.dataset.id, inp = document.getElementById('c-' + id), t = inp.value.trim(), i = get('ideas',id); if(!t || !i) return; inp.value = ''; patch('ideas',id,{comments:[...(i.comments || []), Object.assign({text:t}, stamp())]}); }
});

/* ---------- sign-in ---------- */
function gate(text, signedIn){
  $('#app').hidden = true; $('#gate').hidden = false; $('#gateText').textContent = text;
  $('#gGoogle').hidden = signedIn; $('#gEmailBox').hidden = signedIn; $('#gOut').hidden = !signedIn;
}
async function handleUser(u){
  if(chan){ sb.removeChannel(chan); chan = null; }
  me = null; loaded = false; D = {};
  if(!u){ gate('Members only. Sign in to continue.', false); return; }
  const email = (u.email || '').toLowerCase();
  try{
    await loadMembers();
    me = M.find(m => m.email === email) || null;
    if(!me){ gate(email + ' is not on the team list. Ask an admin to add this exact address, or sign out and use a different account.', true); return; }
    await loadAll();
  }catch(e){ me = null; gate('Could not reach the portal data. Check your connection and try again. ' + (e.message || ''), true); return; }
  if(/[#&?](access_token|code)=/.test(location.href)){ try{ history.replaceState(null,'',location.pathname); }catch(e){} }
  subscribe();
  $('#gate').hidden = true; $('#app').hidden = false; $('#gateErr').textContent = '';
  showTab((location.hash || '').slice(1) || 'today');
}
function boot(){
  if(!window.supabase){ gate('The page could not load fully. Check your connection and reload.', false); $('#gGoogle').hidden = true; $('#gEmailBox').hidden = true; return; }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth:{ persistSession:true, autoRefreshToken:true, detectSessionInUrl:true } });
  const back = location.origin + location.pathname;
  $('#gGoogle').onclick = async () => { $('#gateErr').textContent = ''; const {error} = await sb.auth.signInWithOAuth({provider:'google', options:{redirectTo:back, queryParams:{prompt:'select_account'}}}); if(error) $('#gateErr').textContent = error.message; };
  $('#gLink').onclick = async () => { const e = $('#gEmail').value.trim().toLowerCase(); if(!e){ $('#gateErr').textContent = 'Type your email address first.'; return; }
    $('#gLink').disabled = true; const {error} = await sb.auth.signInWithOtp({email:e, options:{emailRedirectTo:back}}); $('#gLink').disabled = false;
    $('#gateErr').textContent = error ? error.message : 'Check your inbox for a sign-in link, then open it on this device.'; };
  $('#gOut').onclick = () => sb.auth.signOut();
  const err = new URLSearchParams(location.hash.slice(1) || location.search).get('error_description');
  if(err) $('#gateErr').textContent = err.replace(/\+/g,' ');
  sb.auth.onAuthStateChange((event, session) => {
    const u = session && session.user, id = u ? u.id : null;
    if(id === curUid && event !== 'INITIAL_SESSION') return;   // ignore token refreshes
    if(id === curUid && me) return;
    curUid = id; setTimeout(() => handleUser(u), 0);
  });
}
boot();
})();
